name: Verify Pruebas

on:
  push:
    branches:
      - Pruebas
  pull_request:
    branches:
      - Pruebas
      - master

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        id: lint
        continue-on-error: true
        run: npm run lint

      - name: Tests
        id: tests
        continue-on-error: true
        run: npm test

      - name: UI build check
        id: ui
        continue-on-error: true
        run: npm run check:ui

      - name: Automation integration check
        id: automation
        continue-on-error: true
        run: npm run check:automation

      - name: Production build
        id: build
        continue-on-error: true
        run: npm run build

      - name: Verification gate
        if: always()
        run: |
          echo "lint=${{ steps.lint.outcome }}"
          echo "tests=${{ steps.tests.outcome }}"
          echo "ui=${{ steps.ui.outcome }}"
          echo "build=${{ steps.build.outcome }}"
          echo "automation=${{ steps.automation.outcome }}"
          test "${{ steps.lint.outcome }}" = "success"
          test "${{ steps.tests.outcome }}" = "success"
          test "${{ steps.ui.outcome }}" = "success"
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.automation.outcome }}" = "success"
